name: Refresh supermarket prices
on:
  workflow_dispatch:
  schedule:
    - cron: '25 3,11,19 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/refresh.py
      - name: Commit updated dataset
        run: |
          git config user.name "zolharetz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official branch prices"
            git push
          fi
